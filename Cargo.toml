[package]
name = "egui_component"
version = "0.3.0"
edition = "2024"
authors = ["Zehua Yang <march772827981@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["egui", "ui", "component", "ui-kit", "gui"]
description = "Unstyled, headless egui components with granular styling. Includes a fully-customizable styling system with optional pre-configured dark and light themes."
categories = ["gui"]
repository = "https://github.com/March-mitsuki/egui_component"
homepage = "https://github.com/March-mitsuki/egui_component"
# Keep library assets and runnable gallery sources; omit the full downloadable CJK font
# and repository-only publishing/tooling files.
include = [
    "/src/**",
    "/tests/*.rs",
    "/assets/**",
    "/examples/*.rs",
    "/examples/ecml_*/**",
    "/examples/theme.json",
    "/examples/gallery/**",
    "/examples/assets/font-fixtures/**",
    "/images/**",
    "/README.md",
    "/README.zh.md",
    "/CHANGELOG.md",
    "/CHANGELOG.zh.md",
    "/LICENSE",
]

[workspace]
members = ["style_macros", "examples/gallery/web", "router", "examples/router"]
resolver = "3"

[features]
default = []
# Enables every optional feature.
full = ["lucide_icon", "ecml", "calendar", "code"]
lucide_icon = []
ecml = []
# Calendar and date picker components; pulls in the `time` date library.
calendar = ["dep:time"]
# Syntax-highlighted code component; pulls in `syntect` through egui_extras.
code = ["egui_extras/syntect"]

[[example]]
name = "router"
path = "examples/router/src/main.rs"

[dependencies]
egui_component_style_macros = { version = "0.3.0", path = "style_macros" } # internal

anyhow = "1"
tracing = "0.1"

parking_lot = "0.12"

ttf-parser = "0.25"
web-time = "1"
time = { version = "0.3", default-features = false, features = ["std"], optional = true }

egui = { version = "0.37", features = ["serde"] }
# Built-in icons are SVG, so the SVG loader is always enabled. Apps choose any
# other image loaders (http, file, png, ...) on their own egui_extras dependency.
egui_extras = { version = "0.37", features = ["svg"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
font-kit = "0.14"

[dev-dependencies]
egui_component = { path = ".", features = ["full"] }
egui_extras = { version = "0.37", features = ["all_loaders"] }
egui_component_router = { version = "0.3.0", path = "router" }
ehttp = { version = "0.7", features = ["streaming"] }
wuff = { version = "0.2.9", default-features = false, features = ["brotli"] }
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.72"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.99", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
eframe = "0.37"
tracing-subscriber = { version = "0.3", features = ["env-filter"]}
tracing-appender = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }

[[example]]
name = "ecml_hello_world"
path = "examples/ecml_hello_world/main.rs"
required-features = ["ecml"]
