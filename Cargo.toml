[package]
name = "egui_component"
version = "0.1.0-alpha.2"
edition = "2024"
authors = ["Zehua Yang <march772827981@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["egui", "ui", "component", "ui-kit", "gui"]
description = "Unstyled, headless egui components with granular styling. Includes a fully-customizable styling system with optional pre-configured dark and light themes."
categories = ["gui"]
repository = "https://github.com/March-mitsuki/egui_component"
homepage = "https://github.com/March-mitsuki/egui_component"

[workspace]
members = ["examples/gallery/web", "router", "examples/router"]
resolver = "3"

[[example]]
name = "router"
path = "examples/router/src/main.rs"

[dependencies]
egui_component_style_macros = "0.1.0-alpha.2" # internal

anyhow = "1"
tracing = "0.1"

parking_lot = "0.12"

ttf-parser = "0.25"
web-time = "1"

egui = { version = "0.34", features = ["serde"] }
egui_extras = { version = "0.34", features = ["syntect", "all_loaders"] }
egui_animation = "0.11"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
font-kit = "0.14"

[dev-dependencies]
egui_component_router = { path = "router" }
ehttp = { version = "0.7", features = ["streaming"] }
wuff = { version = "0.2.9", default-features = false, features = ["brotli"] }
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.72"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.99", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
eframe = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter"]}
tracing-appender = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
