[package]
name = "egui-component-router-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
egui_component = { path = "../.." }
egui_component_router = { path = "../../router" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.34"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
